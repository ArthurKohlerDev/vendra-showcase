<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">VENDRA — Gestão que acompanha seu negócio</title>
<desc id="desc">Banner em grafite e dourado com o nome VENDRA, destaque para estoque, caixa e rifas.</desc>
<defs>
