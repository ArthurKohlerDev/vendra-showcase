 <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#f5d28c"/><stop offset="1" stop-color="#d7a841"/></linearGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#ffffff" stroke-opacity=".032"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="36"/></filter>
 </defs>
 <rect width="1280" height="360" fill="url(#bg)"/>
