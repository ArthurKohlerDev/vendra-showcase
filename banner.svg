 <text x="82" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="102" font-weight="800" letter-spacing="8" fill="url(#gold)">VENDRA</text>
 <text x="87" y="223" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#e7e9eb">Gestão que acompanha seu negócio.</text>
